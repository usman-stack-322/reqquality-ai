services:
  - type: web
    name: reqquality-ai-api
    runtime: python
    plan: free # Switch to 'starter' for always-on production without cold spin-down
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 90 --graceful-timeout 30 --keep-alive 5 --access-logfile - --error-logfile -
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DATABASE_URL
        sync: false
      - key: REQQUALITY_SECRET_KEY
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_TIMEOUT_MS
        value: "20000"
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: Lax
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: FRONTEND_ORIGINS
        value: https://www.reqqualityai.site,https://reqqualityai.site
      - key: INVITATION_FRONTEND_URL
        value: https://www.reqqualityai.site
      - key: PASSWORD_RESET_FRONTEND_URL
        value: https://www.reqqualityai.site
      - key: DB_POOL_MAX_SIZE
        value: "5"
      - key: DB_POOL_TIMEOUT
        value: "15"
      - key: DB_CONNECT_TIMEOUT
        value: "10"
      - key: DB_KEEPALIVES_IDLE
        value: "30"
      - key: DB_KEEPALIVES_INTERVAL
        value: "10"
      - key: DB_KEEPALIVES_COUNT
        value: "5"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_FROM
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_SSL
        value: "false"
